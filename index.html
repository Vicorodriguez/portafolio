<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RODRÍGUEZ — Visual Artist Portfolio</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter & Archivo Black / Syne for Logo -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
  /* Suaviza la reducción de tamaño de las miniaturas de tus obras */
  img {
    image-rendering: -webkit-optimize-contrast;
    backface-visibility: hidden;
    transform: translateZ(0);
  }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        siteBg: '#ffffff',
                        navText: '#555555',
                        navHover: '#000000',
                        borderLight: '#e5e5e5',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        logo: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #ffffff;
            color: #111111;
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* Minimalist Light Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #ffffff;
        }
        ::-webkit-scrollbar-thumb {
            background: #d1d1d1;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #999999;
        }

        /* Image Grid Hover Transitions */
        .art-card {
            overflow: hidden;
            position: relative;
            cursor: pointer;
            background-color: #ffffff;
        }
        
        .art-img {
            transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1);
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .art-card:hover .art-img {
            transform: scale(1.03);
        }

        /* Active Navigation Link Indicator */
        .nav-link {
            transition: color 0.2s ease;
            position: relative;
        }
        .nav-link.active {
            color: #000000;
            font-weight: 700;
        }

        /* Smooth Hide/Show Transition for Filtering */
        .grid-item {
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        .grid-item.hide {
            display: none !important;
        }
    </style>
</head>
<body class="selection:bg-black selection:text-white min-h-screen flex flex-col justify-between bg-white text-black">

    <!-- Header / Navigation Bar (EXACT matches danilolaynes.com layout) -->
    <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-sm border-b border-borderLight transition-all py-5">
        <div class="max-w-[1600px] mx-auto px-4 sm:px-8 flex items-center justify-between">
            
            <!-- Left Navigation Menu Links -->
            <nav class="hidden lg:flex items-center space-x-6 text-[13px] font-medium uppercase tracking-wider text-navText">
                <button onclick="filterCategory('all', this)" class="nav-link active hover:text-black">PROJECTS</button>
                <button onclick="filterCategory('character', this)" class="nav-link hover:text-black">CHARACTER DESIGN</button>
                <button onclick="filterCategory('commercial', this)" class="nav-link hover:text-black">COMERCIAL WORK</button>
                <button onclick="openSectionModal('bio')" class="nav-link hover:text-black">BIO</button>
                <button onclick="openSectionModal('contact')" class="nav-link hover:text-black">CONTACT</button>
            </nav>

            <!-- Mobile Menu Toggle Button -->
            <button id="menuBtn" class="lg:hidden text-black focus:outline-none p-1">
                <i class="fa-solid fa-bars text-xl" id="menuIcon"></i>
            </button>

            <!-- Centered Stylized Logo / Brand Name -->
            <a href="#" onclick="filterCategory('all', document.querySelector('.nav-link'))" class="text-2xl sm:text-3xl font-black tracking-tighter uppercase text-black font-logo hover:opacity-80 transition-opacity">
                VICO 
            </a>

            <!-- Right Social Icons -->
            <div class="flex items-center space-x-4 text-black text-lg">
                <a href="https://behance.net" target="_blank" rel="noopener" class="hover:opacity-60 transition-opacity font-bold text-base leading-none" title="Behance">
                    Bē
                </a>
                <a href="https://instagram.com/vicorodriguezgz" target="_blank" rel="noopener" class="hover:opacity-60 transition-opacity text-base" title="Instagram">
                    <i class="fa-brands fa-instagram"></i>
                </a>
            </div>

        </div>

        <!-- Mobile Dropdown Navigation -->
        <div id="mobileMenu" class="hidden lg:hidden bg-white border-t border-borderLight px-6 py-4 space-y-3 text-xs font-semibold tracking-wider uppercase text-navText mt-3">
            <button onclick="filterCategory('all', this); toggleMobileMenu();" class="block w-full text-left py-1 hover:text-black">PROJECTS</button>
            <button onclick="filterCategory('character', this); toggleMobileMenu();" class="block w-full text-left py-1 hover:text-black">CHARACTER DESIGN</button>
            <button onclick="filterCategory('commercial', this); toggleMobileMenu();" class="block w-full text-left py-1 hover:text-black">COMERCIAL WORK</button>
            <button onclick="openSectionModal('bio'); toggleMobileMenu();" class="block w-full text-left py-1 hover:text-black">BIO</button>
            <button onclick="openSectionModal('contact'); toggleMobileMenu();" class="block w-full text-left py-1 hover:text-black">CONTACT</button>
        </div>
    </header>

    <!-- Main Content Container: ONLY IMAGES GALLERY GRID -->
    <main class="flex-grow py-8 sm:py-12">
        <!-- Contenedor con ancho máximo centrado (genera los espacios vacíos a los costados) -->
        <div class="max-w-[1300px] mx-auto px-6 sm:px-12">
            
            <!-- Grid de 4 columnas con separación milimétrica (gap-0.5) -->
            <div id="galleryGrid" class="grid grid-cols-2 md:grid-cols-4 gap-0.5">
                
                <!-- Tile 1 -->
                <div class="grid-item art-card aspect-[4/5]" data-category="character" onclick="openLightbox(0)">
                    <img src="img/arboladachico.jpeg" 
                         alt="Character Illustration Art 1" 
                         class="art-img">
                </div>

                <!-- Tile 2 -->
                <div class="grid-item art-card aspect-[4/5]" data-category="commercial" onclick="openLightbox(1)">
                    <img src="img/Campanariochico.jpg" 
                         alt="Comercial Work Poster" 
                         class="art-img">
                </div>

                <!-- Tile 3 -->
                <div class="grid-item art-card aspect-[4/5]" data-category="character" onclick="openLightbox(2)">
                    <img src="img/arroyochico.jpg" 
                         alt="Comic Art & Fantasy Character" 
                         class="art-img">
                </div>

                <!-- Tile 4 -->
                <div class="grid-item art-card aspect-[4/5]" data-category="commercial" onclick="openLightbox(3)">
                    <img src="img/cerroottochico.jpg"

                         class="art-img">
                </div>

                <!-- Tile 5 -->
                <div class="grid-item art-card aspect-[4/5]" data-category="character" onclick="openLightbox(4)">
                    <img src="img/lola2chico.jpg" 
                         alt="Vibrant Creature Design" 
                         class="art-img">
                </div>

                <!-- Tile 6 -->
                <div class="grid-item art-card aspect-[4/5]" data-category="commercial" onclick="openLightbox(5)">
                    <img src="img/danteperro.jpeg" 
                         alt="Brand Editorial Artwork" 
                         class="art-img">
                </div>

                <!-- Tile 7 -->
                <div class="grid-item art-card aspect-[4/5]" data-category="character" onclick="openLightbox(6)">
                    <img src="img/caniche.jpg" 
                         alt="Pop Graphic Surrealism" 
                         class="art-img">
                </div>

                <!-- Tile 8 -->
                <div class="grid-item art-card aspect-[4/5]" data-category="commercial" onclick="openLightbox(7)">
                    <img src="img/caniche3.jpg" 
                         alt="Pattern & Texture Design" 
                         class="art-img">
                </div>

                <!-- Tile 9 -->
                <div class="grid-item art-card aspect-[4/5]" data-category="character" onclick="openLightbox(8)">
                    <img src="img/tortugamuralazul.jpg" 
                         alt="Symbolic Character Design" 
                         class="art-img">
                </div>

                <!-- Tile 10 -->
                <div class="grid-item art-card aspect-[4/5]" data-category="commercial" onclick="openLightbox(9)">
                    <img src="img/muralverde.jpg" 
                         alt="Festival Cover Art" 
                         class="art-img">
                </div>

                <!-- Tile 11 -->
                <div class="grid-item art-card aspect-[4/5]" data-category="character" onclick="openLightbox(10)">
                    <img src="img/florpiba.png" 
                         alt="Fantasy Warrior Concept" 
                         class="art-img">
                </div>

                <!-- Tile 12 -->
                <div class="grid-item art-card aspect-[4/5]" data-category="commercial" onclick="openLightbox(11)">
                    <img src="img/espejo.jpg" 
                         alt="Limited Edition Print" 
                         class="art-img">
                </div>

            </div>
        </div>
    </main>

    <!-- Minimalist Footer -->
    <footer class="py-6 border-t border-borderLight bg-white">
        <div class="max-w-[1600px] mx-auto px-4 sm:px-8 flex flex-col sm:flex-row items-center justify-between text-[11px] text-gray-500 uppercase tracking-widest font-medium gap-2">
            <p>© <span id="year"></span> VICTORIA RODRÍGUEZ. ALL RIGHTS RESERVED.</p>
            <p class="text-gray-400">BUENOS AIRES — ARTIST & ILLUSTRATOR</p>
        </div>
    </footer>

    <!-- Clean Lightbox Modal for Full Image View -->
    <div id="lightbox" class="fixed inset-0 z-50 bg-white/98 hidden opacity-0 transition-opacity duration-200 flex items-center justify-center p-4 sm:p-8">
        
        <!-- Close Button -->
        <button onclick="closeLightbox()" class="absolute top-6 right-6 text-black hover:opacity-50 text-2xl
